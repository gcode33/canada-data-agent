name: ci

on:
  pull_request:
  push: # main is re-checked after every merge: two PRs with valid receipts can merge into
    branches: [main] # a main whose receipt is stale (Phase 6 security review)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d # pg17
        env:
          POSTGRES_USER: canada
          POSTGRES_PASSWORD: canada
          POSTGRES_DB: canada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canada -d canada"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://canada:canada@localhost:5432/canada
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run canada-lint-evals
      - run: uv run pytest
      # Graders over the committed transcripts: no model, no network (PLAN 4.4)
      - run: uv run canada-grade --split dev --check
      # The held-out test split ran once at the release; its verdicts are pinned too.
      - run: uv run canada-grade --split test --check
      # The eval gate runs locally (no model in CI, ADR 0009); CI checks its receipt matches
      # exactly this code, prompt, golden set and data (PLAN 5.2).
      - run: uv run canada-gate verify
      - name: Flag changes to eval inputs (SPEC 10.5)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- evals/baseline.json evals/golden snapshots)
          if [ -n "$changed" ]; then echo "::warning title=Eval inputs changed::$(echo $changed | tr '\n' ' ')"; fi
      - name: The held-out test split ran once; its recordings never change
        if: github.event_name == 'pull_request'
        run: |
          rerun=$(git diff --name-only --diff-filter=MD "origin/${{ github.base_ref }}...HEAD" -- evals/transcripts/test)
          if [ -n "$rerun" ]; then echo "::error title=Test split re-recorded::$rerun"; exit 1; fi
      # Retrieval eval from the committed index: no Voyage key, no StatCan call (PLAN 2.2/2.3).
      # Floors = evals/ablation.md rows; raise them when a PR improves a row.
      - run: uv run canada-migrate
      - run: make seed
      - run: uv run canada-eval-retrieval --method fts --min-recall 0.33 --min-mrr 0.21
      - run: uv run canada-eval-retrieval --method vector --min-recall 0.66 --min-mrr 0.48
      - run: uv run canada-eval-retrieval --method hybrid --min-recall 0.73 --min-mrr 0.40
      - run: uv run canada-eval-retrieval --method hybrid-rerank --min-recall 0.80 --min-mrr 0.62
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
