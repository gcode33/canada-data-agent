name: pages

# The public replay demo (A8 §11, ADR 0010): static files, no model calls, no secrets.
# On every push to main: build and run every web test, then test the exact built files in a
# browser in a separate job (so Playwright's `--with-deps`, which uses sudo apt, never runs in
# the job that produces the site), then deploy. Only the deploy job can write to Pages.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /canada-data-agent/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: uv sync --locked
        working-directory: web
      # The web job's checks, again: main doesn't require that job, so the deploy can't rely on it.
      - run: uv run pytest
        working-directory: web
      - run: uv run canada-web build-demo
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: web/frontend
      - run: npm run typecheck
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: web/frontend/dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/frontend/dist

  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The exact files about to be published, and the replay data the tests read.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: web/frontend/dist
      - run: cp -R dist/replays dist/index.json dist/tested.json public/
        working-directory: web/frontend
      - run: npm ci --ignore-scripts
        working-directory: web/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: web/frontend
      - run: npm run e2e
        working-directory: web/frontend

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
