name: fresh-clone

# PLAN 6.1: a clean clone with no keys reaches a checked, cited answer in under 10 minutes.
# The model's choices are replayed from committed transcripts (`canada-ask --offline`); the
# MCP server, tools, snapshot, index and every answer check run for real.
on:
  push:
    tags: ["v*", "w*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the "under 10 minutes" claim is enforced, not measured once
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: canada
          POSTGRES_PASSWORD: canada
          POSTGRES_DB: canada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canada -d canada"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://canada:canada@localhost:5432/canada
      ANTHROPIC_API_KEY: "" # no keys: proves a fresh clone needs none
      VOYAGE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run canada-migrate
      - run: make seed
      - name: Answer three questions offline (lookup, multi-step, refusal)
        run: |
          set -euo pipefail
          for q in \
            "What was the all-items Consumer Price Index for Canada in September 2026?" \
            "Where was regular self-serve gas cheaper in September 2026, Toronto or Vancouver, and what did it cost in each?" \
            "Should I buy a house in Toronto or keep renting?"; do
            echo "::group::$q"
            uv run canada-ask --offline "$q"
            echo "::endgroup::"
          done
