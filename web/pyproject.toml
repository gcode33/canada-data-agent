[project]
name = "canada-web"
version = "0.0.0"
description = "Web UI for the Canada Data Agent: a static replay demo and a local-only live mode (A8, ADR 0010)"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The agent, by path: web/ imports every rule (run_events, CITABLE_URL, foreign_links, ...)
    # and never copies one (A8 E2). Not a workspace member: that would share the root lock,
    # and web/ must stay outside the eval gate's fingerprint (A8 E4).
    "canada-data-agent",
    "pydantic>=2.10",
]

[project.scripts]
canada-web = "canada_web.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
canada-data-agent = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canada_web"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
